<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Cookie Sync</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      min-height: 200px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e3a5f 100%);
      padding: 16px 18px 14px;
      border-bottom: 1px solid rgba(99,102,241,0.3);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .header-title { font-size: 15px; font-weight: 700; color: #c7d2fe; }
    .header-subtitle { font-size: 10px; color: #818cf8; margin-top: 1px; }

    .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

    .status-card {
      background: rgba(30,27,75,0.6);
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-idle    { background: #64748b; }
    .dot-success { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .dot-error   { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
    .dot-loading { background: #f59e0b; animation: pulse 1s infinite; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .status-text { color: #94a3b8; }
    .status-msg  { font-size: 11px; color: #64748b; margin-top: 5px; word-break: break-all; }
    .status-time { font-size: 10px; color: #475569; margin-top: 3px; }

    .cookie-count {
      font-size: 11px;
      color: #818cf8;
      background: rgba(99,102,241,0.12);
      border-radius: 6px;
      padding: 4px 8px;
      margin-top: 6px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .cookie-badge {
      background: rgba(99,102,241,0.2);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 9px;
      font-family: monospace;
      color: #a5b4fc;
    }

    .btn-sync {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn-sync:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(99,102,241,0.4);
    }

    .btn-sync:active:not(:disabled) { transform: translateY(0); }
    .btn-sync:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .server-row {
      display: flex;
      gap: 6px;
    }

    .server-input {
      flex: 1;
      background: rgba(30,27,75,0.6);
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 8px;
      padding: 7px 10px;
      color: #c7d2fe;
      font-size: 11px;
      outline: none;
      transition: border-color 0.2s;
    }

    .server-input:focus { border-color: #6366f1; }

    .btn-save {
      padding: 7px 12px;
      background: rgba(99,102,241,0.2);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 8px;
      color: #a5b4fc;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-save:hover { background: rgba(99,102,241,0.35); }

    .tip {
      font-size: 10px;
      color: #475569;
      text-align: center;
      line-height: 1.5;
    }
    .tip a { color: #6366f1; text-decoration: none; cursor: pointer; }
    .tip a:hover { text-decoration: underline; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">🔄</div>
    <div>
      <div class="header-title" style="display:flex;align-items:center;gap:6px;">
        <span>Gemini Cookie Sync</span>
        <span style="font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,0.15);font-weight:normal;color:#e0e7ff;">v1.2.4</span>
      </div>
      <div class="header-subtitle">Tự động đồng bộ cookie → Server</div>
    </div>
  </div>

  <div class="body">
    <!-- Status Card -->
    <div class="status-card">
      <div class="status-row">
        <div class="dot dot-idle" id="statusDot"></div>
        <span class="status-text" id="statusText">Chưa đồng bộ</span>
      </div>
      <div class="status-msg" id="statusMsg"></div>
      <div class="status-time" id="statusTime"></div>
      <div class="cookie-count" id="cookieList" style="display:none;"></div>
    </div>

    <!-- Sync Button -->
    <button class="btn-sync" id="btnSync">
      <span id="btnIcon">🔄</span>
      <span id="btnText">Đồng bộ Cookie ngay</span>
    </button>

    <!-- Server URL Setting -->
    <div class="server-row">
      <input type="text" class="server-input" id="serverInput" placeholder="http://localhost:8000" />
      <button class="btn-save" id="btnSave">Lưu</button>
    </div>

    <div class="tip">
      Đảm bảo bạn đã đăng nhập tại
      <a id="linkGemini" href="#">gemini.google.com</a>
      trước khi đồng bộ.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
